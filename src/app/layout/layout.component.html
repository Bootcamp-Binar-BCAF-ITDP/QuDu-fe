<div class="min-h-screen bg-slate-100">
  <app-sidebar [open]="sidebarOpen()" (dismiss)="closeSidebar()" />

  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-30 bg-slate-900/50 lg:hidden"
      aria-hidden="true"
      (click)="closeSidebar()"
    ></div>
  }

  <main class="flex min-h-screen flex-col lg:ml-[280px]">
    <app-header [title]="pageTitle()" (openMenu)="openSidebar()" />

    <section class="flex-1 p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </section>
  </main>
</div>
