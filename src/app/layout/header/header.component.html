<header
  class="sticky top-0 z-20 flex h-[82px] items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 sm:gap-5 sm:px-6 lg:px-8"
>
  <div class="flex min-w-0 items-center gap-3">
    <button
      type="button"
      (click)="openMenu.emit()"
      class="-ml-1 shrink-0 rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 hover:text-green-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700 lg:hidden"
      aria-label="Open navigation"
    >
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        @for (d of icons.menu; track $index) {
          <path [attr.d]="d" stroke-linecap="round" stroke-linejoin="round" />
        }
      </svg>
    </button>

    <h2 class="truncate text-lg font-bold tracking-tight text-slate-800 sm:text-2xl">
      {{ title() }}
    </h2>
  </div>
