<aside
  class="fixed left-0 top-0 z-40 flex h-screen w-[280px] max-w-[85vw] flex-col border-r border-slate-200 bg-white transition-transform duration-200 motion-reduce:transition-none lg:translate-x-0"
  [class.translate-x-0]="open()"
  [class.-translate-x-full]="!open()"
>
  <div class="flex h-[82px] shrink-0 items-center gap-3 border-b border-slate-200 px-6">
    <div class="min-w-0">
      <img src="logo.png" alt="QuickDuit" class="h-14 w-auto object-contain" />
    </div>

    <button
      type="button"
      (click)="dismiss.emit()"
      class="ml-auto shrink-0 rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700 lg:hidden"
      aria-label="Close navigation"
    >
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        @for (d of icons.close; track $index) {
          <path [attr.d]="d" stroke-linecap="round" stroke-linejoin="round" />
        }
      </svg>
    </button>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto p-4" aria-label="Main">
    @for (item of navItems(); track item.label) {
      @if (item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="!bg-green-50 !text-green-800"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover: cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700"
        >
          <svg
            class="h-5 w-5 shrink-0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            @for (d of item.icon; track $index) {
              <path [attr.d]="d" stroke-linecap="round" stroke-linejoin="round" />
            }
          </svg>
          {{ item.label }}
        </a>
      } @else {
        <div>
          <button
            type="button"
            class="flex w-full items-center justify-between rounded-xl px-4 py-3 text-sm font-medium transition hover:bg-slate-100 hover: cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700"
            [class]="isGroupActive(item) ? 'bg-green-50 text-green-800' : 'text-slate-600'"
            [attr.aria-expanded]="isOpen(item)"
            (click)="toggleGroup(item)"
          >
            <span class="flex items-center gap-3">
              <svg
                class="h-5 w-5 shrink-0"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                @for (d of item.icon; track $index) {
                  <path [attr.d]="d" stroke-linecap="round" stroke-linejoin="round" />
                }
              </svg>
              {{ item.label }}
            </span>

            <svg
              class="h-4 w-4 transition-transform duration-200 motion-reduce:transition-none"
              [class.rotate-180]="isOpen(item)"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              @for (d of icons.chevronDown; track $index) {
                <path [attr.d]="d" stroke-linecap="round" stroke-linejoin="round" />
              }
            </svg>
          </button>

          @if (isOpen(item)) {
            <div class="ml-6 mt-1 space-y-1 border-l-2 border-slate-100 pl-3">
              @for (child of item.children; track child.route) {
                <a
                  [routerLink]="child.route"
                  routerLinkActive="!bg-green-50 !text-green-800 !font-medium"
                  class="block rounded-lg px-4 py-2.5 text-sm text-slate-600 transition hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700"
                >
                  {{ child.label }}
                </a>
              }
            </div>
          }
        </div>
      }
    }
  </nav>

  <div class="shrink-0 border-t border-slate-100 p-4">
    @for (item of footerItems(); track item.label) {
      @if (item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="!bg-green-50 !text-green-800"
          class="flex cursor-pointer items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700"
        >
          <svg
            class="h-5 w-5 shrink-0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            @for (d of item.icon; track $index) {
              <path [attr.d]="d" stroke-linecap="round" stroke-linejoin="round" />
            }
          </svg>
          {{ item.label }}
        </a>
      } @else {
        <button
          type="button"
          (click)="onFooterAction(item)"
          class="flex w-full cursor-pointer items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-red-50 hover:text-red-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700"
        >
          <svg
            class="h-5 w-5 shrink-0"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            @for (d of item.icon; track $index) {
              <path [attr.d]="d" stroke-linecap="round" stroke-linejoin="round" />
            }
          </svg>
          {{ item.label }}
        </button>
      }
    }
  </div>
</aside>
