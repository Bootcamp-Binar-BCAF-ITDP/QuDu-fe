<div class="bg-white rounded-lg border border-gray-200">
  <div class="overflow-x-auto">
    <table class="w-full text-sm text-left">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th
            *ngFor="let column of columns"
            (click)="toggleSort(column)"
            class="px-6 py-4 font-semibold text-gray-700 whitespace-nowrap select-none"
            [class.cursor-pointer]="column.sortable"
            [class.hover:bg-gray-100]="column.sortable"
          >
            <span class="inline-flex items-center gap-1">
              {{ column.label }}

              <span
                *ngIf="column.sortable"
                class="text-xs"
                [class.text-green-600]="isSortedBy(column)"
                [class.text-gray-400]="!isSortedBy(column)"
              >
                {{ sortIcon(column) }}
              </span>
            </span>
          </th>

          <th class="px-6 py-4 font-semibold text-gray-700">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngIf="loading">
          <td [attr.colspan]="columns.length + 1" class="px-6 py-8 text-center text-gray-500">
            Loading data...
          </td>
        </tr>

        <tr
          *ngFor="let row of data"
          class="border-b border-gray-100 hover:bg-gray-50"
          [hidden]="loading"
        >
          <td *ngFor="let column of columns" class="px-6 py-4 text-gray-700 whitespace-nowrap">
            <span *ngIf="column.type !== 'status'">
              {{ getValue(row, column.key) }}
            </span>

            <span
              *ngIf="column.type === 'status'"
              class="px-3 py-1 rounded-full text-xs font-medium"
              [class.bg-green-100]="getValue(row, column.key)"
              [class.text-green-700]="getValue(row, column.key)"
              [class.bg-red-100]="!getValue(row, column.key)"
              [class.text-red-700]="!getValue(row, column.key)"
            >
              {{ getValue(row, column.key) ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex gap-2">
              <button
                type="button"
                (click)="onEdit(row)"
                class="px-3 py-1.5 text-sm bg-blue-500 text-white rounded-md hover:bg-blue-600 cursor-pointer"
              >
                Edit
              </button>

              <button
                type="button"
                (click)="onDelete(row)"
                class="px-3 py-1.5 text-sm bg-red-500 text-white rounded-md hover:bg-red-600 cursor-pointer"
              >
                Delete
              </button>
            </div>
          </td>
        </tr>

        <tr *ngIf="!loading && data.length === 0">
          <td [attr.colspan]="columns.length + 1" class="px-6 py-8 text-center text-gray-500">
            {{ emptyMessage }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div
    *ngIf="showPagination"
    class="flex flex-col sm:flex-row justify-between items-center gap-4 px-6 py-4 border-t border-gray-200"
  >
    <div class="flex items-center gap-4">
      <span class="text-sm text-gray-500">
        Showing {{ showingFrom }} - {{ showingTo }} of {{ totalItems }} {{ itemLabel }}
      </span>

      <select
        [value]="pageSize"
        (change)="onPageSizeChange($event)"
        class="px-2 py-1 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-500"
      >
        <option *ngFor="let option of pageSizeOptions" [value]="option">{{ option }} / page</option>
      </select>
    </div>

    <div class="flex items-center gap-1">
      <button
        type="button"
        (click)="changePage(currentPage - 1)"
        [disabled]="currentPage === 1 || loading"
        class="px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100 hover: cursor-pointer"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <button
        *ngFor="let page of visiblePages"
        type="button"
        (click)="changePage(page)"
        [disabled]="loading"
        class="px-3 py-2 text-sm border rounded-lg disabled:cursor-not-allowed"
        [class.bg-green-600]="page === currentPage"
        [class.text-white]="page === currentPage"
        [class.border-green-600]="page === currentPage"
        [class.bg-white]="page !== currentPage"
        [class.border-gray-300]="page !== currentPage"
        [class.hover:bg-gray-100]="page !== currentPage"
      >
        {{ page }}
      </button>

      <button
        type="button"
        (click)="changePage(currentPage + 1)"
        [disabled]="currentPage === totalPages || loading"
        class="px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100 hover: cursor-pointer"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </div>
</div>
