@if (current()) {
  <!-- z-60 sits above the application review modal's z-50: this opens on top of it. -->
  <div
    class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 p-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
    (click)="closeModal()"
  >
    <!-- Stops a click inside the panel from reaching the backdrop handler. -->
    <div
      class="flex max-h-[90vh] w-full max-w-4xl flex-col overflow-hidden rounded-xl bg-white shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <header class="flex items-start justify-between gap-4 border-b border-slate-200 px-6 py-4">
        <div class="min-w-0">
          <h2 class="text-base font-semibold text-green-800">{{ title }}</h2>
          <p class="truncate text-xs text-slate-500" [title]="fileName">{{ fileName }}</p>
        </div>

        <button
          type="button"
          class="cursor-pointer rounded-md p-1.5 text-slate-500 transition hover:bg-slate-100 hover:text-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700"
          aria-label="Close preview"
          (click)="closeModal()"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>

      <div class="flex min-h-[320px] flex-1 items-center justify-center overflow-auto bg-slate-50 p-4">
        @if (loading()) {
          <p class="text-sm text-slate-500">Loading document…</p>
        } @else if (error()) {
          <p class="max-w-sm text-center text-sm text-red-600">{{ error() }}</p>
        } @else if (objectUrl()) {
          @if (isImage) {
            <img
              [src]="objectUrl()"
              [alt]="title"
              class="max-h-[70vh] w-auto max-w-full object-contain"
            />
          } @else if (isPdf) {
            <iframe
              [src]="frameUrl()"
              [title]="title"
              class="h-[70vh] w-full rounded-md border border-slate-200 bg-white"
            ></iframe>
          } @else {
            <p class="max-w-sm text-center text-sm text-slate-500">
              This file type cannot be shown here. Use Download to open it.
            </p>
          }
        }
      </div>

      <footer class="flex items-center justify-end gap-3 border-t border-slate-200 px-6 py-3">
        <!-- Points at the object URL that is already in memory, so saving a copy
             costs no second trip to the server. -->
        @if (objectUrl()) {
          <a
            [href]="objectUrl()"
            [download]="fileName"
            class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700"
          >
            Download
          </a>
        }

        <button
          type="button"
          class="cursor-pointer rounded-md bg-green-800 px-4 py-2 text-sm font-semibold text-white transition hover:bg-green-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700"
          (click)="closeModal()"
        >
          Close
        </button>
      </footer>
    </div>
  </div>
}
