<div
      class="flex flex-col items-center justify-center gap-3"
      [class.min-h-screen]="fullScreen()"
      [class.fixed]="fullScreen()"
      [class.inset-0]="fullScreen()"
      [class.bg-white/75]="fullScreen()"
      [class.backdrop-blur-sm]="fullScreen()"
      [class.z-50]="fullScreen()"
      [class.p-4]="!fullScreen()"
    >
      <svg
        class="animate-spin text-blue-600"
        [class.w-5]="size() === 'sm'" [class.h-5]="size() === 'sm'"
        [class.w-8]="size() === 'md'" [class.h-8]="size() === 'md'"
        [class.w-12]="size() === 'lg'" [class.h-12]="size() === 'lg'"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>

      @if (text()) {
        <span class="text-gray-600 font-medium animate-pulse" [class.text-sm]="size() === 'sm'">
          {{ text() }}
        </span>
      }
    </div>
