<div class="flex min-h-[70vh] items-center justify-center px-4 py-16">
  <div class="w-full max-w-lg text-center">
    <div
      class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-green-50 text-green-800 ring-1 ring-green-100"
      aria-hidden="true"
    >
      <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8 3h6l4 4v9a1 1 0 01-1 1H8a1 1 0 01-1-1V4a1 1 0 011-1z"
        />
        <path stroke-linecap="round" stroke-linejoin="round" d="M14 3v5h5" />
        <circle cx="12" cy="16" r="4" />
        <path stroke-linecap="round" d="M15 19l3 3" />
      </svg>
    </div>

    <p class="mt-6 text-xs font-semibold uppercase tracking-[0.2em] text-green-800">Error 404</p>

    <h1 class="mt-2 text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">
      We couldn’t find that page
    </h1>

    <p class="mx-auto mt-3 max-w-md text-sm leading-relaxed text-slate-600">
      The link may be out of date, or the record may have been moved. Nothing has been changed.
    </p>

    <div class="mt-7 flex flex-wrap items-center justify-center gap-2">
      @if (canGoBack) {
        <button
          type="button"
          (click)="back()"
          class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-700 focus-visible:ring-offset-2"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
          Go back
        </button>
      }
    </div>
  </div>
</div>
