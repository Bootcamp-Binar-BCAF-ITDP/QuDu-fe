<div class="min-h-screen bg-slate-100">
  <!-- Sidebar -->
  <aside
    class="fixed left-0 top-0 flex h-screen w-[280px] flex-col border-r border-slate-200 bg-white"
  >
    <!-- Logo -->
    <div class="flex h-[82px] items-center gap-3 border-b border-slate-200 px-6">
      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl bg-green-800 text-xl text-white"
      >
        ♜
      </div>

      <div>
        <h1 class="text-2xl font-bold text-green-800">
          QuickDuit
        </h1>

        <p class="text-xs text-slate-500">
          Enterprise Banking
        </p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 space-y-2 p-4">
      <!-- Dashboard -->
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-green-50 text-green-800"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
      >
        <span class="text-lg">▦</span>
        Dashboard
      </a>

      <!-- Applications -->
      <a
        routerLink="/applications"
        routerLinkActive="bg-green-50 text-green-800"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
      >
        <span class="text-lg">▣</span>
        Applications
      </a>

      <!-- Master Data -->
      <button
        type="button"
        (click)="toggleMasterMenu()"
        class="flex w-full items-center justify-between rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
      >
        <span class="flex items-center gap-3">
          <span class="text-lg">⚙</span>
          Master Data
        </span>

        <span>
          {{ masterMenuOpen ? '⌃' : '⌄' }}
        </span>
      </button>

      @if (masterMenuOpen) {
        <div class="ml-5 space-y-1 border-l-2 border-slate-100 pl-3">
          <a
            routerLink="/master/roles"
            routerLinkActive="bg-green-50 text-green-800"
            class="block rounded-lg px-4 py-2.5 text-sm text-slate-600 transition hover:bg-slate-100"
          >
            Role
          </a>

          <a
            routerLink="/master/branches"
            routerLinkActive="bg-green-50 text-green-800"
            class="block rounded-lg px-4 py-2.5 text-sm text-slate-600 transition hover:bg-slate-100"
          >
            Branch
          </a>

          <a
            routerLink="/master/menus"
            routerLinkActive="bg-green-50 text-green-800"
            class="block rounded-lg px-4 py-2.5 text-sm text-slate-600 transition hover:bg-slate-100"
          >
            Menu
          </a>

          <a
            routerLink="/master/users"
            routerLinkActive="bg-green-50 text-green-800"
            class="block rounded-lg px-4 py-2.5 text-sm text-slate-600 transition hover:bg-slate-100"
          >
            User
          </a>
        </div>
      }

      <!-- Approval History -->
      <a
        routerLink="/approval-history"
        routerLinkActive="bg-green-50 text-green-800"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
      >
        <span class="text-lg">◷</span>
        Approval History
      </a>

      <!-- Reports -->
      <a
        routerLink="/reports"
        routerLinkActive="bg-green-50 text-green-800"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
      >
        <span class="text-lg">▤</span>
        Reports
      </a>
    </nav>

    <!-- Bottom -->
    <div class="border-t border-slate-100 p-4">
      <a
        routerLink="/settings"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition hover:bg-slate-100"
      >
        <span>⚙</span>
        Settings
      </a>
    </div>
  </aside>

  <!-- Main -->
  <main class="ml-[280px] min-h-screen">
    <!-- Header -->
    <header
      class="flex h-[82px] items-center justify-between border-b border-slate-200 bg-white px-8"
    >
      <h2 class="text-2xl font-bold text-slate-800">
        Master Data
      </h2>

      <div class="flex items-center gap-5">
        <!-- Search -->
        <div class="relative">
          <span
            class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
          >
            🔍
          </span>

          <input
            type="text"
            placeholder="Search..."
            class="w-[260px] rounded-xl border border-slate-300 bg-slate-50 py-3 pl-11 pr-4 text-sm outline-none focus:border-green-700 focus:bg-white focus:ring-4 focus:ring-green-100"
          />
        </div>

        <button
          class="text-lg text-slate-500 hover:text-green-700"
        >
          ♧
        </button>

        <div class="h-8 border-l border-slate-200"></div>

        <div
          class="flex h-10 w-10 items-center justify-center rounded-full bg-green-100 font-semibold text-green-800"
        >
          A
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <section class="p-8">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
