<div class="p-4 sm:p-6">
  <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Menu Management</h1>

      <p class="text-sm text-gray-500 mt-1">Manage your menu data</p>
    </div>

    <button
      type="button"
      (click)="addMenu()"
      class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition cursor-pointer"
    >
      + Add Menu
    </button>
  </div>

  <div class="mb-4">
    <input
      type="text"
      [(ngModel)]="search"
      (ngModelChange)="onSearch()"
      placeholder="Search menu..."
      class="w-full md:w-80 px-4 py-2 border border-gray-300 bg-white rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
    />
  </div>

  <app-table
    [columns]="columns"
    [data]="menu()"
    [loading]="loading()"
    emptyMessage="No menu data available"
    itemLabel="menu"
    [currentPage]="currentPage"
    [pageSize]="pageSize"
    [totalItems]="totalElements()"
    [sortBy]="sortBy"
    [sortDir]="sortDir"
    (edit)="editMenu($event)"
    (delete)="deleteMenu($event)"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (sortChange)="onSortChange($event)"
  />

  <div *ngIf="modalOpen()" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/50" (click)="closeModal()"></div>

    <div class="relative max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-xl bg-white shadow-xl">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <div>
          <h2 class="text-xl font-semibold text-gray-800">
            {{ editingMenuId !== null ? 'Edit Menu' : 'Add Menu' }}
          </h2>

          <p class="text-sm text-gray-500 mt-1">
            {{ editingMenuId !== null ? 'Update menu information' : 'Create a new menu' }}
          </p>
        </div>

        <button
          type="button"
          (click)="closeModal()"
          class="text-gray-400 hover:text-gray-600 text-2xl leading-none"
        >
          &times;
        </button>
      </div>

      <form [formGroup]="menuForm" (ngSubmit)="saveMenu()">
        <div class="p-6 grid grid-cols-1">
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700"> Menu Name </label>

            <input
              type="text"
              formControlName="menuName"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            />

            <p
              *ngIf="menuForm.get('menuName')?.touched && menuForm.get('menuName')?.invalid"
              class="mt-1 text-sm text-red-500"
            >
              Menu name is required.
            </p>
          </div>
        </div>

        <div
          class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-xl"
        >
          <button
            type="button"
            (click)="closeModal()"
            [disabled]="submitting()"
            class="px-5 py-2 border border-gray-300 rounded-lg bg-white hover:bg-gray-100 disabled:opacity-50"
          >
            Cancel
          </button>

          <button
            type="submit"
            [disabled]="submitting()"
            class="px-5 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50"
          >
            {{ submitting() ? 'Saving...' : editingMenuId !== null ? 'Update Menu' : 'Save Menu' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
