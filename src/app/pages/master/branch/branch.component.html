<div class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Branch Management</h1>

      <p class="text-sm text-gray-500 mt-1">Manage your branch data</p>
    </div>

    <!-- Add Branch -->
    <button
      type="button"
      (click)="addBranch()"
      class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition cursor-pointer"
    >
      + Add Branch
    </button>
  </div>

  <!-- Search -->
  <div class="mb-4">
    <input
      type="text"
      [(ngModel)]="search"
      (ngModelChange)="onSearch()"
      placeholder="Search branch..."
      class="w-full md:w-80 px-4 py-2 border border-gray-300 bg-white rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
    />
  </div>

  <!-- Table + Pagination -->
  <app-table
    [columns]="columns"
    [data]="branches()"
    [loading]="loading()"
    emptyMessage="No branch data available"
    itemLabel="branches"
    [currentPage]="currentPage"
    [pageSize]="pageSize"
    [totalItems]="totalElements()"
    [sortBy]="sortBy"
    [sortDir]="sortDir"
    (edit)="editBranch($event)"
    (delete)="deleteBranch($event)"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (sortChange)="onSortChange($event)"
  />

  <!-- ADD / EDIT MODAL -->
  <div *ngIf="modalOpen()" class="fixed inset-0 z-50 flex items-center justify-center">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/50" (click)="closeModal()"></div>

    <!-- Modal -->
    <div class="relative w-full max-w-2xl mx-4 bg-white rounded-xl shadow-xl">
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <div>
          <h2 class="text-xl font-semibold text-gray-800">
            {{ editingBranchId !== null ? 'Edit Branch' : 'Add Branch' }}
          </h2>

          <p class="text-sm text-gray-500 mt-1">
            {{ editingBranchId !== null ? 'Update branch information' : 'Create a new branch' }}
          </p>
        </div>

        <!-- Close -->
        <button
          type="button"
          (click)="closeModal()"
          class="text-gray-400 hover:text-gray-600 text-2xl leading-none"
        >
          &times;
        </button>
      </div>

      <!-- Modal Body -->
      <form [formGroup]="branchForm" (ngSubmit)="saveBranch()">
        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Branch Code -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700"> Branch Code </label>

            <input
              type="text"
              formControlName="branchCode"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            />

            <p
              *ngIf="branchForm.get('branchCode')?.touched && branchForm.get('branchCode')?.invalid"
              class="mt-1 text-sm text-red-500"
            >
              Branch code is required.
            </p>
          </div>

          <!-- Branch Name -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700"> Branch Name </label>

            <input
              type="text"
              formControlName="branchName"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            />

            <p
              *ngIf="branchForm.get('branchName')?.touched && branchForm.get('branchName')?.invalid"
              class="mt-1 text-sm text-red-500"
            >
              Branch name is required.
            </p>
          </div>

          <!-- Location -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700"> Location </label>

            <input
              type="text"
              formControlName="location"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <!-- Email -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700"> Email </label>

            <input
              type="email"
              formControlName="email"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            />

            <p
              *ngIf="branchForm.get('email')?.touched && branchForm.get('email')?.hasError('email')"
              class="mt-1 text-sm text-red-500"
            >
              Please enter a valid email.
            </p>
          </div>

          <!-- Phone Number -->
          <div>
            <label class="block mb-2 text-sm font-medium text-gray-700"> Phone Number </label>

            <input
              type="text"
              formControlName="phoneNumber"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
            />
          </div>

          <!-- Active -->
          <div class="flex items-center gap-2 md:mt-8">
            <input
              id="isActive"
              type="checkbox"
              formControlName="isActive"
              class="w-4 h-4 text-green-600 border-gray-300 rounded"
            />

            <label for="isActive" class="text-sm font-medium text-gray-700"> Active </label>
          </div>
        </div>

        <!-- Modal Footer -->
        <div
          class="flex justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50 rounded-b-xl"
        >
          <!-- Cancel -->
          <button
            type="button"
            (click)="closeModal()"
            [disabled]="submitting()"
            class="px-5 py-2 border border-gray-300 rounded-lg bg-white hover:bg-gray-100 disabled:opacity-50"
          >
            Cancel
          </button>

          <!-- Save -->
          <button
            type="submit"
            [disabled]="submitting()"
            class="px-5 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50"
          >
            {{
              submitting()
                ? 'Saving...'
                : editingBranchId !== null
                  ? 'Update Branch'
                  : 'Save Branch'
            }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
